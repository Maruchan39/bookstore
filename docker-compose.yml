networks:
  default:
    name: nordsec

services:
  mysql:
    container_name: ${MYSQL_CONTAINER_NAME}
    image: mysql:8.4
    restart: unless-stopped
    volumes:
      - ./docker-volumes/master-mysql:/var/lib/mysql:cached
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookstore}
      MYSQL_USER: ${MYSQL_USER:-bookstore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bookstore}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
